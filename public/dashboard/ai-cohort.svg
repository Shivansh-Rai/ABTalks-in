<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 242 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F8F8"/>
    </linearGradient>
    <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#B9F4EC"/>
      <stop offset="0.45" stop-color="#4FD1C5"/>
      <stop offset="1" stop-color="#0E9AA0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B8A90"/>
      <stop offset="1" stop-color="#05585E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD6CC" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5FD6CC" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- Chat bubble, centred in the tile -->
    <path id="bubble" d="M84 70 H158 A24 24 0 0 1 182 94 V136 A24 24 0 0 1 158 160 H112 L86 184 L90 160 H84 A24 24 0 0 1 60 136 V94 A24 24 0 0 1 84 70 Z"/>
  </defs>

  <rect width="242" height="256" fill="url(#bg)"/>

  <!-- Soft diagonal bars behind, like the other logos' stripes -->
  <g filter="url(#soft)">
    <rect x="-40" y="36" width="340" height="34" rx="17" transform="rotate(38 121 128)" fill="url(#bar)"/>
    <rect x="-40" y="176" width="340" height="26" rx="13" transform="rotate(38 121 128)" fill="url(#bar)"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="128" cy="196" rx="62" ry="12" fill="#0B8A90" opacity="0.28" filter="url(#shadow)"/>

  <!-- Extrusion: stacked copies stepping down-right give the depth -->
  <g fill="url(#side)">
    <use xlink:href="#bubble" transform="translate(12 12)"/>
    <use xlink:href="#bubble" transform="translate(10 10)"/>
    <use xlink:href="#bubble" transform="translate(8 8)"/>
    <use xlink:href="#bubble" transform="translate(6 6)"/>
    <use xlink:href="#bubble" transform="translate(4 4)"/>
    <use xlink:href="#bubble" transform="translate(2 2)"/>
  </g>

  <!-- Lit front face with a bevel highlight -->
  <use xlink:href="#bubble" fill="url(#face)"/>
  <use xlink:href="#bubble" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5"/>
  <path d="M78 80 H150" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round"/>

  <!-- Typing dots, raised -->
  <g>
    <circle cx="96" cy="117" r="10" fill="#05585E" opacity="0.35" transform="translate(2 3)"/>
    <circle cx="121" cy="117" r="10" fill="#05585E" opacity="0.35" transform="translate(2 3)"/>
    <circle cx="146" cy="117" r="10" fill="#05585E" opacity="0.35" transform="translate(2 3)"/>
    <circle cx="96" cy="117" r="10" fill="#FFFFFF"/>
    <circle cx="121" cy="117" r="10" fill="#FFFFFF"/>
    <circle cx="146" cy="117" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Sparkle, echoing the Snowflake art's accent lines -->
  <path d="M190 52 Q192 62 202 64 Q192 66 190 76 Q188 66 178 64 Q188 62 190 52 Z" fill="#2BB8B0" opacity="0.85"/>
  <path d="M52 188 L40 200" stroke="#2BB8B0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
